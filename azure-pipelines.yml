trigger:
  branches:
    include:
      - master # Triggers the pipeline on pushes to the master branch

pool:
  vmImage: 'windows-latest' # Specifies the virtual machine image for the agent

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Build C# Project'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x' # Installs the latest .NET 8 SDK
        installationPath: '$(Agent.ToolsDirectory)/dotnet'

    - script: |
        dotnet restore
        dotnet build --configuration Release
      displayName: 'Restore and Build Solution'

    - task: DotNetCoreCLI@2
      displayName: 'Run Tests'
      inputs:
        command: 'test'
        projects: '**/HelloWorld.csproj' # Runs tests in projects ending with Tests.csproj

    - task: DotNetCoreCLI@2
      displayName: 'Publish Artifact'
      inputs:
        command: 'publish'
        publishWebProjects: true # Publishes web projects
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Upload Build Artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'